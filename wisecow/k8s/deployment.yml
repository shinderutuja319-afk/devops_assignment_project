apiVersion: apps/v1
kind: Deployment

metadata:
  name: wisecow-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: wisecow

  template:
    metadata:
      labels:
        app: wisecow

    spec:
      containers:
        - name: wisecow
          image: wisecow:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4499

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            tcpSocket:
              port: 4499
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 4499
            initialDelaySeconds: 15
            periodSeconds: 20
